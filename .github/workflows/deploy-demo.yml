name: Deploy til GitHub Pages

# Bygger appen og udgiver den på GitHub Pages. Deployer kun fra main.
#
# Er repo-secrets VITE_SUPABASE_URL og VITE_SUPABASE_ANON_KEY sat, bygges
# den rigtige udgave med delt data i Supabase ("● Delt"-badge). Mangler
# de, bygges demo-udgaven i stedet (localStorage, "◐ Demo"-badge).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kun én Pages-deploy ad gangen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Uden Supabase-secrets bygges demo-udgaven.
          VITE_DEMO: ${{ secrets.VITE_SUPABASE_URL == '' && 'true' || 'false' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
